name: CD

on:
  push:
    branches: [main]
    # 문서·요청 예시만 바뀐 머지는 서버 동작이 같으므로 재배포하지 않는다.
    # (PR 단계의 CI 는 그대로 실행된다. 필요하면 Actions 에서 수동 실행)
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "http/**"
      - ".github/pull_request_template.md"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  ci:
    name: 배포 전 검증
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Cloudtype 배포
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: 배포 설정 확인
        id: guard
        env:
          CLOUDTYPE_TOKEN: ${{ secrets.CLOUDTYPE_TOKEN }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          missing=()
          for name in CLOUDTYPE_TOKEN DB_URL DB_USERNAME DB_PASSWORD JWT_SECRET; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning title=배포 건너뜀::설정되지 않은 Secrets: ${missing[*]} (README 의 '배포 준비' 참고)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # 설정값은 Cloudtype 대시보드의 CLI 탭(dasi-siheung-backend.yaml)과 같게 유지한다.
      # 여기 값이 배포 때마다 대시보드 설정을 덮어쓴다.
      # 소스는 Cloudtype GitHub 앱 권한으로 가져온다. (조직 정책상 Deploy key 를 쓸 수 없어 connect 단계는 쓰지 않음)
      - name: Cloudtype 배포 요청
        if: steps.guard.outputs.ready == 'true'
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          project: wonjongwoo01/dasi-siheung-backend
          stage: main
          yaml: |
            name: dasi-siheung-backend
            app: java@21
            options:
              ports: "8080"
              start: java -XX:MaxRAMPercentage=75 -jar build/libs/app.jar
              build: ./gradlew clean bootJar
              healthz: /actuator/health/readiness
              initialDelaySeconds: "180"
              strategy: recreate
              env:
                - name: SPRING_PROFILES_ACTIVE
                  value: prod
                - name: TZ
                  value: Asia/Seoul
                - name: DB_URL
                  value: "${{ secrets.DB_URL }}"
                - name: DB_USERNAME
                  value: "${{ secrets.DB_USERNAME }}"
                - name: DB_PASSWORD
                  value: "${{ secrets.DB_PASSWORD }}"
                - name: JWT_SECRET
                  value: "${{ secrets.JWT_SECRET }}"
              buildenv: []
            context:
              git:
                url: https://github.com/${{ github.repository }}.git
                branch: main
