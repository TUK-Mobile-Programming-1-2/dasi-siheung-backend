name: CI

on:
  pull_request:
  push:
    branches: [develop, test]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# 러너 로컬 PostgreSQL(setup-postgis 액션 기본값)에 접속한다
env:
  DB_URL: jdbc:postgresql://localhost:5432/dasi_siheung
  DB_USERNAME: dasi
  DB_PASSWORD: dasi
  TEST_DB_URL: jdbc:postgresql://localhost:5432/dasi_siheung
  TEST_DB_USERNAME: dasi
  TEST_DB_PASSWORD: dasi

jobs:
  build:
    name: 빌드 · 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v4

      - name: PostgreSQL + PostGIS 준비
        uses: ./.github/actions/setup-postgis

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 설정 (캐시)
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드 · 테스트 · API 명세 생성
        run: ./gradlew build generateApiDocs

      - name: API 명세 최신 여부 확인
        run: |
          if ! git diff --quiet -- src/main/resources/static/docs/openapi3.yaml; then
            echo "::warning title=API 명세 갱신 필요::REST Docs 결과와 커밋된 openapi3.yaml 이 다릅니다. './gradlew generateApiDocs' 실행 후 함께 커밋하세요."
            git diff -- src/main/resources/static/docs/openapi3.yaml
          fi

      - name: 테스트 · 커버리지 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
          retention-days: 7

      - name: API 명세 업로드
        uses: actions/upload-artifact@v4
        with:
          name: openapi3
          path: build/api-spec/openapi3.yaml
          retention-days: 7

      - name: 실행 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

  http-test:
    name: HTTP 시나리오 테스트 (.http)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v4

      - name: PostgreSQL + PostGIS 준비
        uses: ./.github/actions/setup-postgis

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 실행 파일 받기
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: build/libs

      - name: 서버 기동 (local 프로필)
        run: |
          nohup java -jar build/libs/*.jar --spring.profiles.active=local > app.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "서버 기동 완료"
              exit 0
            fi
            sleep 2
          done
          echo "::error::서버가 120초 안에 기동되지 않았습니다."
          tail -n 200 app.log
          exit 1

      - name: IntelliJ HTTP Client CLI 설치
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ijhttp.zip" https://jb.gg/ijhttp/latest
          unzip -q "$RUNNER_TEMP/ijhttp.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ijhttp" >> "$GITHUB_PATH"

      - name: .http 기대값 검증
        working-directory: http
        run: ijhttp --env-file http-client.env.json --env local ./*.http

      - name: 서버 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: http-test-app-log
          path: app.log
          retention-days: 7
