name: CI

on:
  pull_request:
  push:
    branches: [develop, test]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# 러너 로컬 PostgreSQL(setup-postgis 액션 기본값)에 접속한다
env:
  DB_URL: jdbc:postgresql://localhost:5432/dasi_siheung
  DB_USERNAME: dasi
  DB_PASSWORD: dasi
  TEST_DB_URL: jdbc:postgresql://localhost:5432/dasi_siheung
  TEST_DB_USERNAME: dasi
  TEST_DB_PASSWORD: dasi

jobs:
  build:
    name: 빌드 · 테스트
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v7

      - name: PostgreSQL + PostGIS 준비
        uses: ./.github/actions/setup-postgis

      - name: JDK 21 설치
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 설정 (캐시)
        uses: gradle/actions/setup-gradle@v6

      - name: 빌드 · 테스트 · API 명세 생성
        run: ./gradlew build generateApiDocs

      - name: API 명세 최신 여부 확인
        run: |
          if ! git diff --quiet -- src/main/resources/static/docs/openapi3.yaml; then
            echo "::warning title=API 명세 갱신 필요::REST Docs 결과와 커밋된 openapi3.yaml 이 다릅니다. './gradlew generateApiDocs' 실행 후 함께 커밋하세요."
            git diff -- src/main/resources/static/docs/openapi3.yaml
          fi

      # 아티팩트 저장 용량(조직 공용)이 차면 업로드가 실패한다. 리포트는 실패를 볼 때만 필요하므로
      # 실패했을 때만 올리고, 업로드가 안 돼도 빌드 결과(성공 · 실패)는 바꾸지 않는다.
      - name: 테스트 · 커버리지 리포트 업로드 (실패 시)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
          retention-days: 3

  http-test:
    name: HTTP 시나리오 테스트 (.http)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v7

      - name: PostgreSQL + PostGIS 준비
        uses: ./.github/actions/setup-postgis

      - name: JDK 21 설치
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 설정 (캐시)
        uses: gradle/actions/setup-gradle@v6

      # 빌드 job 의 jar(65MB)를 아티팩트로 넘기면 실행마다 저장 용량을 차지하므로 여기서 다시 만든다.
      - name: 실행 파일 만들기
        run: ./gradlew bootJar

      - name: 서버 기동 (local 프로필)
        run: |
          nohup java -jar build/libs/*.jar --spring.profiles.active=local > app.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "서버 기동 완료"
              exit 0
            fi
            sleep 2
          done
          echo "::error::서버가 120초 안에 기동되지 않았습니다."
          tail -n 200 app.log
          exit 1

      # 관리자는 가입 API 로 만들 수 없으므로 DBA 승격과 같은 방식(SQL)으로 테스트용 관리자를 만든다.
      # 비밀번호 해시는 pgcrypto 의 crypt(bf) — 서버의 BCrypt 와 호환된다.
      - name: 테스트용 관리자 준비
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
          CI_ADMIN_EMAIL: ci-admin@test.dasisiheung.com
          CI_ADMIN_PASSWORD: ci-admin-password1
        run: |
          psql -h localhost -U "$DB_USERNAME" -d dasi_siheung -v ON_ERROR_STOP=1 \
            -v email="$CI_ADMIN_EMAIL" -v password="$CI_ADMIN_PASSWORD" <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          INSERT INTO member (email, password_hash, name, phone, role, status, created_at, updated_at)
          VALUES (:'email', crypt(:'password', gen_salt('bf', 10)), 'CI 관리자', '01000000000', 'ADMIN', 'ACTIVE', now(), now())
          ON CONFLICT (email) DO NOTHING;
          SQL
          printf '{"local": {"adminEmail": "%s", "adminPassword": "%s"}}' "$CI_ADMIN_EMAIL" "$CI_ADMIN_PASSWORD" \
            > http/http-client.private.env.json

      - name: IntelliJ HTTP Client CLI 설치
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ijhttp.zip" https://jb.gg/ijhttp/latest
          unzip -q "$RUNNER_TEMP/ijhttp.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ijhttp" >> "$GITHUB_PATH"

      - name: .http 기대값 검증
        working-directory: http
        run: ijhttp --env-file http-client.env.json --private-env-file http-client.private.env.json --env local ./*.http

      - name: 서버 로그 업로드 (실패 시)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: http-test-app-log
          path: app.log
          retention-days: 3
