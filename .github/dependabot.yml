version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - "org.springframework*"
      test:
        patterns:
          - "com.tngtech.archunit*"
          - "com.epages*"
    ignore:
      # Spring Boot 는 3.x 를 유지한다
      - dependency-name: "org.springframework.boot*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
