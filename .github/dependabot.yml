version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - "org.springframework*"
      test:
        patterns:
          - "com.tngtech.archunit*"
          - "com.epages*"
    ignore:
      # Spring Boot 는 3.x 를 유지한다
      - dependency-name: "org.springframework.boot*"
        update-types: ["version-update:semver-major"]
      # springdoc 3.x 는 Spring Boot 4 전용
      - dependency-name: "org.springdoc*"
        update-types: ["version-update:semver-major"]
      # restdocs-api-spec 0.20 이상은 Spring Boot 4 전용
      - dependency-name: "com.epages*"
        versions: [">= 0.20.0"]
      # Gradle 은 8.x 를 유지한다
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
