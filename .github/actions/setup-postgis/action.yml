name: PostgreSQL + PostGIS 준비
description: 러너에 기본 설치된 PostgreSQL 에 PostGIS 를 추가하고 테스트용 DB·계정을 만든다.

inputs:
  database:
    description: 만들 데이터베이스 이름
    default: dasi_siheung
  username:
    description: 접속 계정
    default: dasi
  password:
    description: 접속 비밀번호
    default: dasi

runs:
  using: composite
  steps:
    - name: PostGIS 설치 · DB 생성
      shell: bash
      env:
        DB_NAME: ${{ inputs.database }}
        DB_USER: ${{ inputs.username }}
        DB_PASSWORD: ${{ inputs.password }}
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_MODE: a
      run: |
        set -euo pipefail
        PG_MAJOR="$(ls /usr/lib/postgresql | sort -V | tail -n 1)"
        echo "PostgreSQL ${PG_MAJOR} 에 PostGIS 를 설치합니다."

        # 저장소 응답이 멈추면 apt 가 끝없이 기다리므로 시도마다 시간 제한을 두고 재시도한다
        APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
                  -o DPkg::Lock::Timeout=120)
        retry() {
          local limit=$1; shift
          for attempt in 1 2 3; do
            if sudo --preserve-env=DEBIAN_FRONTEND,NEEDRESTART_MODE timeout "$limit" "$@"; then
              return 0
            fi
            echo "::warning title=PostGIS 준비 재시도::$* (${attempt}/3 실패)"
            sudo dpkg --configure -a || true
            sleep 5
          done
          return 1
        }

        # 러너 이미지는 패키지를 설치할 때마다 man 페이지 색인(man-db 트리거)을 다시 만들어 수 분씩 걸린다
        sudo rm -f /var/lib/man-db/auto-update

        echo "::group::apt-get update"
        retry 120 apt-get update "${APT_OPTS[@]}"
        echo "::endgroup::"

        # 확장 생성에 필요한 패키지만 설치 (권장 패키지인 shp2pgsql 등 CLI 도구 · GDAL 유틸은 제외)
        echo "::group::PostGIS 설치"
        retry 300 apt-get install -y -q --no-install-recommends "${APT_OPTS[@]}" \
          "postgresql-${PG_MAJOR}-postgis-3"
        echo "::endgroup::"

        sudo systemctl start postgresql.service

        # PostGIS 확장 생성(Flyway V1)에는 슈퍼유저 권한이 필요하다
        sudo -u postgres psql -v ON_ERROR_STOP=1 \
          -c "CREATE ROLE ${DB_USER} WITH LOGIN SUPERUSER PASSWORD '${DB_PASSWORD}';"
        sudo -u postgres createdb -O "${DB_USER}" "${DB_NAME}"

        pg_isready -h localhost -p 5432
