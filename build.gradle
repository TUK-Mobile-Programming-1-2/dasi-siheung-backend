plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.epages.restdocs-api-spec' version '0.19.4'
}

group = 'com.dasisiheung'
version = '0.0.1-SNAPSHOT'
description = '다시, 시흥 - 빈 상가를 짧은 판매·전시 공간으로 연결하는 서비스의 백엔드'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    springdocVersion = '2.9.1'
    restdocsApiSpecVersion = '0.19.4'
    archunitVersion = '1.5.1'
}

dependencies {
    // Web · Validation · Security
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Database · PostGIS · Migration
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.hibernate.orm:hibernate-spatial'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // API 문서 (Swagger UI)
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation "com.epages:restdocs-api-spec-mockmvc:${restdocsApiSpecVersion}"
    testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
    finalizedBy 'jacocoTestReport'
}

tasks.named('jacocoTestReport') {
    dependsOn 'test'
    reports {
        xml.required = true
        html.required = true
    }
}

// 실행 가능한 bootJar 하나만 만든다 (배포 시 plain jar 혼동 방지)
tasks.named('jar') {
    enabled = false
}

// REST Docs 테스트 → OpenAPI 명세
openapi3 {
    server = '/'
    title = '다시, 시흥 API'
    description = 'Spring REST Docs 테스트를 통과한 API만 담긴 명세입니다.'
    version = project.version.toString()
    format = 'yaml'
}

tasks.matching { it.name == 'openapi3' }.configureEach {
    dependsOn 'test'
}

// 생성된 명세를 커밋 대상인 정적 리소스로 옮긴다.
// Copy 태스크로 src/main/resources 를 출력으로 선언하면 processResources 입력과 겹쳐
// Gradle 의 암묵적 의존성 검사에 걸리므로, 출력 선언 없이 파일만 복사한다.
def generatedApiSpec = layout.buildDirectory.file('api-spec/openapi3.yaml')
def publishedApiSpec = file('src/main/resources/static/docs/openapi3.yaml')

tasks.register('generateApiDocs') {
    group = 'documentation'
    description = 'REST Docs 테스트로 만든 openapi3.yaml 을 정적 리소스(/docs/openapi3.yaml)에 반영합니다.'
    dependsOn 'openapi3'
    doLast {
        publishedApiSpec.parentFile.mkdirs()
        java.nio.file.Files.copy(
                generatedApiSpec.get().asFile.toPath(),
                publishedApiSpec.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("API 명세 갱신: src/main/resources/static/docs/openapi3.yaml")
    }
}
