        required: false
        schema:
          type: string
      - name: keyword
        in: query
        description: 공간 이름 · 주소 검색어 (최대 50자)
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: "정렬 (선택지 spaceSorts, 기본 LATEST)"
