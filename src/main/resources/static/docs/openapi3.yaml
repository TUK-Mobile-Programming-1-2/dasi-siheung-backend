openapi: 3.0.1
info:
  title: "다시, 시흥 API"
  description: Spring REST Docs 테스트를 통과한 API만 담긴 명세입니다.
  version: 0.0.1-SNAPSHOT
servers:
- url: /
tags: []
paths:
  /api/v1/applications:
    get:
      tags:
      - Application
      summary: 내가 보낸 신청
      description: 최근 순입니다.
      operationId: application-my-list
      parameters:
      - name: status
        in: query
        description: 신청 상태 필터 (선택지 applicationStatuses)
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: 페이지 (0부터)
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: 페이지 크기 (최대 100)
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: "Bearer {액세스 토큰}"
        required: true
        schema:
          type: string
        example: Bearer eyJhbGciOiJIUzM4NCJ9.eyJzdWIiOiIxIiwicm9sZSI6IlVTRVIiLCJpYXQiOjE3OTI0OTc2MDAsImV4cCI6MTc5MjQ5OTQwMH0.qCsN0QXweH8Gj_bAv3s3HLo7SnDsOxEnz6rOqzYHwT8m_vfVz4TnSeJzE2f9ib8e
