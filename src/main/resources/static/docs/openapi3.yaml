        description: 이용 시작일 yyyy-MM-dd
        required: false
        schema:
          type: string
      - name: endDate
        in: query
        description: 이용 종료일 yyyy-MM-dd — 기간의 모든 날짜가 비어 있는 공간만
        required: false
