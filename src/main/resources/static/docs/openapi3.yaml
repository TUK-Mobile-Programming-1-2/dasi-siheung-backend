        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/api-v1-applications1750884053"
              examples:
                application-my-list:
                  value: |-
                    {
                      "success" : true,
                      "data" : {
                        "content" : [ {
                          "id" : 7,
                          "status" : "PENDING",
                          "spaceId" : 10,
                          "spaceTitle" : "정왕역 앞 1층 상가",
                          "thumbnailUrl" : "https://abc.supabase.co/storage/v1/object/public/space-photos/spaces/10/photos/b.jpg",
                          "applicantName" : "이이용",
                          "activityType" : "POPUP_STORE",
                          "activityTitle" : "수제 캔들 팝업 스토어",
                          "startDate" : "2026-10-23",
                          "endDate" : "2026-10-24",
                          "totalPrice" : 100000,
                          "negotiationStatus" : "NONE",
                          "conversationId" : 3,
                          "createdAt" : "2026-10-20T21:00:00"
                        } ],
                        "page" : 0,
                        "size" : 20,
                        "totalElements" : 1,
                        "totalPages" : 1,
                        "hasNext" : false
                      }
                    }
