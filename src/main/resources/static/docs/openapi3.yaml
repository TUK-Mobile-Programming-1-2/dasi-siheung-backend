  /api/v1/reports:
    post:
      tags:
      - Report
      summary: 신고하기
      description: "로그인 회원 누구나. multipart/form-data 로 보냅니다. 파트: targetType · targetId\
        \ · reason · detail(선택) 텍스트, photos(증거 사진, 선택, 최대 5장, JPG·PNG·WEBP 10MB).\
        \ 대상이 없으면 404 REPORT_TARGET_NOT_FOUND, 자기 자신 · 자기 글은 400 CANNOT_REPORT_SELF,\
        \ 처리 대기 중 같은 신고는 409 DUPLICATE_REPORT, 사진 5장 초과 400 REPORT_PHOTO_LIMIT_EXCEEDED,\
        \ 사진 형식 400 UNSUPPORTED_FILE_TYPE · 크기 413 FILE_TOO_LARGE. 사진 하나라도 실패하면 신고\
        도 접수되지 않습니다."
      operationId: report-create
      parameters:
      - name: Authorization
        in: header
        description: "Bearer {액세스 토큰}"
        required: true
        schema:
          type: string
        example: Bearer eyJhbGciOiJIUzM4NCJ9.eyJzdWIiOiIxIiwicm9sZSI6IlVTRVIiLCJpYXQiOjE3OTI0OTc2MDAsImV4cCI6MTc5MjQ5OTQwMH0.qCsN0QXweH8Gj_bAv3s3HLo7SnDsOxEnz6rOqzYHwT8m_vfVz4TnSeJzE2f9ib8e
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
