# 로컬 개발 — DB_URL / DB_USERNAME / DB_PASSWORD 환경 변수로 접속한다. (예: Supabase 개발 프로젝트)
# 값이 없으면 로컬에 설치한 PostgreSQL(localhost:5432)을 사용한다.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dasi_siheung}
    username: ${DB_USERNAME:dasi}
    password: ${DB_PASSWORD:dasi}
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

# 로컬·CI 전용 기본 키. 운영(prod)에는 이 값이 없으므로 JWT_SECRET 을 넣지 않으면 기동되지 않는다.
app:
  jwt:
    secret: ${JWT_SECRET:local-development-only-jwt-secret-key-0123456789}

management:
  endpoint:
    health:
      show-details: always
