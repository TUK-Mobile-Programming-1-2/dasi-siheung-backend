spring:
  application:
    name: dasi-siheung-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  servlet:
    multipart:
      # 파일별 제한(사진 10MB, 증빙 20MB)은 서버가 따로 검사한다. 여기는 요청 전체 상한
      max-file-size: 20MB
      max-request-size: 100MB
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  paths-to-match: /api/**
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    urls-primary-name: 실시간 명세 (springdoc)
    urls:
      - name: 실시간 명세 (springdoc)
        url: /v3/api-docs
      - name: 테스트 검증 명세 (REST Docs)
        url: /docs/openapi3.yaml

app:
  jwt:
    # 운영은 반드시 32바이트 이상의 임의 문자열을 JWT_SECRET 으로 넣는다. (openssl rand -base64 48)
    secret: ${JWT_SECRET:}
    access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:30m}
    refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY:14d}
  storage:
    # local: 로컬 디스크(build/local-storage) / supabase: Supabase Storage (운영)
    provider: ${STORAGE_PROVIDER:local}
    signed-url-ttl: 10m
    supabase:
      url: ${SUPABASE_URL:}
      service-key: ${SUPABASE_SERVICE_KEY:}
      public-bucket: ${SUPABASE_PUBLIC_BUCKET:space-photos}
      private-bucket: ${SUPABASE_PRIVATE_BUCKET:private-files}
    local:
      root: ${STORAGE_LOCAL_ROOT:build/local-storage}
      base-url: ${STORAGE_LOCAL_BASE_URL:http://localhost:${PORT:8080}}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
